<!-- Bread Sheet - Main HTML File -->
<!-- Author: Ajay Singh -->
<!-- Version: 1.2 -->
<!-- Date: 04-06-2024 -->
<!-- Description: HTML structure for the Bread Sheet application with improved glassomorphic design -->

<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Meta Tags -->
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta
      name="description"
      content="Bread Sheet is a modern web-based spreadsheet data management application with powerful data manipulation capabilities."
    />
    <meta name="theme-color" content="#0c101a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Title -->
    <title>Bread Sheet</title>

    <!-- Favicon and Icons -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="favicon_io/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="favicon_io/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="favicon_io/favicon-16x16.png"
    />
    <link rel="manifest" href="favicon_io/site.webmanifest" />

    <!-- Stylesheet -->
    <link rel="stylesheet" href="styles.css" />

    <!-- External JS Library -->
    <script
      src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"
      defer
    ></script>
  </head>

  <body>
    <!-- Skip to content link for accessibility -->
    <a href="#main-content" class="skip-link">Skip to main content</a>
    
    <!-- Navigation Bar -->
    <nav class="navbar">
      <div class="nav-left">
        <div class="app-title">
          <h1 id="projectTitle">Bread Sheet</h1>
          <span class="version-badge">v1.2</span>
        </div>
      </div>
      
      <div class="nav-center">
        <!-- Search Bar (hidden initially) -->
        <div id="searchContainer" class="search-container">
          <div class="search-input-wrapper">
            <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none">
              <circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2"/>
              <path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="2"/>
            </svg>
            <input
              type="text"
              id="searchInput"
              placeholder="Search data..."
              aria-label="Search through data"
            />
            <button id="clearSearch" class="clear-search" title="Clear search" aria-label="Clear search">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                <line x1="18" y1="6" x2="6" y2="18" stroke="currentColor" stroke-width="2"/>
                <line x1="6" y1="6" x2="18" y2="18" stroke="currentColor" stroke-width="2"/>
              </svg>
            </button>
          </div>
        </div>
      </div>
      
      <div class="nav-right">
        <!-- Import Button -->
        <button id="importButton" class="nav-button import-button" title="Import file" aria-label="Import file">
          <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none">
            <line x1="12" y1="5" x2="12" y2="19" stroke="currentColor" stroke-width="2"/>
            <line x1="5" y1="12" x2="19" y2="12" stroke="currentColor" stroke-width="2"/>
          </svg>
        </button>
        
        <!-- Theme Toggle -->
        <button id="themeToggle" class="nav-button theme-toggle" aria-label="Toggle dark/light theme">
          <!-- Sun icon (shown in dark mode) -->
          <svg class="nav-icon sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="5" stroke="currentColor" stroke-width="2"/>
            <line x1="12" y1="1" x2="12" y2="3" stroke="currentColor" stroke-width="2"/>
            <line x1="12" y1="21" x2="12" y2="23" stroke="currentColor" stroke-width="2"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" stroke="currentColor" stroke-width="2"/>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" stroke="currentColor" stroke-width="2"/>
            <line x1="1" y1="12" x2="3" y2="12" stroke="currentColor" stroke-width="2"/>
            <line x1="21" y1="12" x2="23" y2="12" stroke="currentColor" stroke-width="2"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" stroke="currentColor" stroke-width="2"/>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" stroke="currentColor" stroke-width="2"/>
          </svg>
          <!-- Moon icon (shown in light mode) -->
          <svg class="nav-icon moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" style="display: none;">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" stroke="currentColor" stroke-width="2"/>
          </svg>
        </button>
        
        <!-- Tools Dropdown -->
        <div class="dropdown">
          <button id="toolsButton" class="nav-button tools-button" aria-haspopup="true" aria-expanded="false" title="Tools">
            <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" stroke="currentColor" stroke-width="2"/>
            </svg>
          </button>
          <div class="dropdown-menu" role="menu">
            <button id="refreshButton" class="dropdown-item" role="menuitem" disabled>
              <svg class="format-icon" width="16" height="16" viewBox="0 0 24 24" fill="none">
                <polyline points="23 4 23 10 17 10" stroke="currentColor" stroke-width="2"/>
                <polyline points="1 20 1 14 7 14" stroke="currentColor" stroke-width="2"/>
                <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15" stroke="currentColor" stroke-width="2"/>
              </svg>Refresh Data
            </button>
            <button id="showKeyboardShortcuts" class="dropdown-item" role="menuitem">
              <svg class="format-icon" width="16" height="16" viewBox="0 0 24 24" fill="none">
                <rect x="2" y="4" width="20" height="16" rx="2" stroke="currentColor" stroke-width="2"/>
                <path d="M6 8h.01M10 8h.01M14 8h.01M18 8h.01M8 12h.01M12 12h.01M16 12h.01M9 16h6" stroke="currentColor" stroke-width="2"/>
              </svg>Keyboard Shortcuts
            </button>
          </div>
        </div>
        
        <!-- Export Dropdown -->
        <div class="dropdown">
          <button id="exportButton" class="nav-button export-button" disabled aria-haspopup="true" aria-expanded="false" title="Export data">
            <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" stroke="currentColor" stroke-width="2"/>
              <polyline points="7 10 12 15 17 10" stroke="currentColor" stroke-width="2"/>
              <line x1="12" y1="15" x2="12" y2="3" stroke="currentColor" stroke-width="2"/>
            </svg>
          </button>
          <div class="dropdown-menu" role="menu">
            <button data-format="xlsx" class="dropdown-item" role="menuitem">
              <svg class="format-icon" width="16" height="16" viewBox="0 0 24 24" fill="none">
                <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z" stroke="currentColor" stroke-width="2"/>
                <polyline points="14 2 14 8 20 8" stroke="currentColor" stroke-width="2"/>
              </svg>Excel (.xlsx)
            </button>
            <button data-format="csv" class="dropdown-item" role="menuitem">
              <svg class="format-icon" width="16" height="16" viewBox="0 0 24 24" fill="none">
                <rect x="3" y="3" width="18" height="18" rx="2" stroke="currentColor" stroke-width="2"/>
                <path d="M8 12h8M8 8h8M8 16h8" stroke="currentColor" stroke-width="2"/>
              </svg>CSV (.csv)
            </button>
            <button data-format="txt" class="dropdown-item" role="menuitem">
              <svg class="format-icon" width="16" height="16" viewBox="0 0 24 24" fill="none">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" stroke="currentColor" stroke-width="2"/>
                <polyline points="14 2 14 8 20 8" stroke="currentColor" stroke-width="2"/>
                <line x1="16" y1="13" x2="8" y2="13" stroke="currentColor" stroke-width="2"/>
                <line x1="16" y1="17" x2="8" y2="17" stroke="currentColor" stroke-width="2"/>
              </svg>Text (.txt)
            </button>
            <button data-format="html" class="dropdown-item" role="menuitem">
              <svg class="format-icon" width="16" height="16" viewBox="0 0 24 24" fill="none">
                <polyline points="16 18 22 12 16 6" stroke="currentColor" stroke-width="2"/>
                <polyline points="8 6 2 12 8 18" stroke="currentColor" stroke-width="2"/>
              </svg>HTML (.html)
            </button>
          </div>
        </div>
        
      </div>
    </nav>
    
    <!-- Main Content -->
    <main id="main-content" class="main-content">
      <!-- Welcome Page (shown when no file is loaded) -->
      <div id="welcomePage" class="welcome-page">
        <div class="welcome-content">
          <div class="welcome-header">
            <div class="welcome-icon">
              <svg width="64" height="64" viewBox="0 0 512 512" fill="none">
                <g transform="translate(0.000000,512.000000) scale(0.100000,-0.100000)">
                  <path d="M2940 5113 c-119 -7 -332 -36 -470 -63 -611 -122 -1044 -379 -1200
                    -712 -26 -56 -65 -197 -56 -205 2 -2 38 3 82 12 199 37 367 49 654 49 456 0
                    779 -47 1150 -170 490 -163 855 -438 1015 -768 70 -143 88 -225 89 -396 1
                    -164 -12 -228 -73 -370 -42 -96 -100 -187 -178 -277 l-53 -61 0 -466 0 -467
                    408 3 407 3 34 24 c64 46 61 -16 61 1173 l0 1083 88 90 c96 97 157 192 193
                    295 33 96 33 267 0 365 -32 96 -78 177 -148 260 -342 407 -1150 648 -2003 598z"/>
                  <path d="M1735 3893 c-632 -42 -1185 -234 -1481 -515 -178 -170 -263 -356
                    -251 -553 10 -159 81 -300 228 -451 l79 -80 2 -1101 c3 -1090 3 -1102 23
                    -1129 11 -15 36 -35 55 -45 33 -18 95 -19 1565 -19 1437 0 1532 1 1565 18 19
                    9 45 32 57 51 l23 34 0 1090 0 1090 93 96 c144 150 205 276 214 441 30 545
                    -667 991 -1671 1070 -119 9 -383 11 -501 3z m-605 -2253 c45 -23 80 -80 80
                    -131 0 -74 -76 -149 -151 -149 -46 0 -108 39 -130 82 -37 72 -14 151 57 194
                    48 29 92 30 144 4z m0 -750 c45 -23 80 -80 80 -131 0 -74 -76 -149 -151 -149
                    -46 0 -108 39 -130 82 -37 72 -14 151 57 194 48 29 92 30 144 4z m750 0 c45
                    -23 80 -80 80 -131 0 -74 -76 -149 -151 -149 -46 0 -108 39 -130 82 -37 72
                    -14 151 57 194 48 29 92 30 144 4z"/>
                </g>
              </svg>
            </div>
            <h2>Welcome to Bread Sheet</h2>
            <p>Your modern spreadsheet viewer and editor</p>
          </div>
          
          <div class="upload-area" id="uploadArea">
            <div class="upload-icon">
              <svg width="48" height="48" viewBox="0 0 24 24" fill="none">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" stroke="currentColor" stroke-width="2"/>
                <polyline points="17 8 12 3 7 8" stroke="currentColor" stroke-width="2"/>
                <line x1="12" y1="3" x2="12" y2="15" stroke="currentColor" stroke-width="2"/>
              </svg>
            </div>
            <h3>Import Your Data</h3>
            <p>Drag and drop your files here or click to browse</p>
            <div class="supported-formats">
              <span class="format-tag">Excel (.xlsx, .xls)</span>
              <span class="format-tag">CSV (.csv)</span>
              <span class="format-tag">Text (.txt)</span>
            </div>
            <button class="browse-button" id="browseButton">
              <span>Browse Files</span>
            </button>
          </div>
          
        </div>
      </div>


      
      <!-- Data Output Section (hidden initially) -->
      <div id="dataView" class="data-view" style="display: none;">
        <section id="output" role="region" aria-label="Data table content" tabindex="0"></section>
      </div>
    </main>

    <!-- Hidden File Upload Input -->
    <input
      type="file"
      id="fileInput"
      accept=".xlsx,.xls,.csv,.txt,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,text/csv,text/plain"
      style="display: none"
      aria-label="Upload Excel, CSV, or text file"
    />


    <!-- Loading Indicator with improved animation -->
    <div id="loadingIndicator" class="loading-indicator" style="display: none" role="status" aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>
      <div class="loading-text">Loading your file...</div>
    </div>

    <!-- Toast container for notifications -->
    <div id="toastContainer" class="toast-container" aria-live="polite"></div>
    
    <!-- Main Script -->
    <script src="script.js"></script>
  </body>
</html>
